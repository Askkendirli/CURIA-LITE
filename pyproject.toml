[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curia-lite"
version = "0.1.2"
description = "Local list-only EU case-law finder with multilingual relevance screening"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "Ahmet Şadan Kutay Kendirli"}]
license = "MIT"
dependencies = ["requests>=2.32.3,<3", "beautifulsoup4>=4.12.3,<5", "python-docx>=1.1.2,<2"]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
curia-lite = "curia_lite.cli:main"

[tool.setuptools.packages.find]
include = ["curia_lite*"]

[tool.setuptools.package-data]
curia_lite = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
